<svg viewBox="0 0 700 284" xmlns="http://www.w3.org/2000/svg" font-family="Spectral, Georgia, serif"><defs><marker id="ar" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#0b0b0c"/></marker></defs><text x="6" y="14" font-size="7" text-anchor="start" fill="#5c5c61" font-weight="500" font-style="normal" letter-spacing="1.2">DEPLOYMENT TOPOLOGY · FAILURE DOMAINS</text><rect x="30" y="40" width="400" height="150" rx="0" fill="none" stroke="#d6d6d9" stroke-width="0.6" stroke-dasharray="4 3"/><text x="36" y="34" font-size="6.4" text-anchor="start" fill="#5c5c61" font-weight="500" font-style="normal" letter-spacing="1.2">FAILURE DOMAIN A · APPLICATION HOST</text><rect x="44" y="54" width="116" height="34" rx="2" fill="none" stroke="#0b0b0c" stroke-width="0.8"/><text x="102" y="75" font-size="6.8" text-anchor="middle" fill="#0b0b0c" font-weight="500" font-style="normal" letter-spacing="0">user-service</text><rect x="172" y="54" width="116" height="34" rx="2" fill="none" stroke="#0b0b0c" stroke-width="0.8"/><text x="230" y="75" font-size="6.8" text-anchor="middle" fill="#0b0b0c" font-weight="500" font-style="normal" letter-spacing="0">bill_service</text><rect x="300" y="54" width="116" height="34" rx="2" fill="none" stroke="#0b0b0c" stroke-width="0.8"/><text x="358" y="75" font-size="6.8" text-anchor="middle" fill="#0b0b0c" font-weight="500" font-style="normal" letter-spacing="0">quotation</text><rect x="44" y="116" width="116" height="34" rx="2" fill="none" stroke="#0b0b0c" stroke-width="0.8"/><text x="102" y="137" font-size="6.8" text-anchor="middle" fill="#0b0b0c" font-weight="500" font-style="normal" letter-spacing="0">worker</text><rect x="172" y="116" width="116" height="34" rx="2" fill="none" stroke="#0b0b0c" stroke-width="0.8"/><text x="230" y="137" font-size="6.8" text-anchor="middle" fill="#0b0b0c" font-weight="500" font-style="normal" letter-spacing="0">laundry-mgmt</text><rect x="456" y="40" width="214" height="74" rx="0" fill="none" stroke="#d6d6d9" stroke-width="0.6" stroke-dasharray="4 3"/><text x="462" y="34" font-size="6.4" text-anchor="start" fill="#5c5c61" font-weight="500" font-style="normal" letter-spacing="1.2">DOMAIN B · DATABASE</text><rect x="466" y="54" width="92" height="44" rx="2" fill="none" stroke="#0b0b0c" stroke-width="0.8"/><text x="512" y="72" font-size="6.8" text-anchor="middle" fill="#0b0b0c" font-weight="500" font-style="normal" letter-spacing="0">primary</text><text x="512" y="84" font-size="6.2" text-anchor="middle" fill="#5c5c61" font-weight="400" font-style="normal" letter-spacing="0">oplog</text><rect x="566" y="54" width="92" height="44" rx="2" fill="none" stroke="#0b0b0c" stroke-width="0.8"/><text x="612" y="72" font-size="6.8" text-anchor="middle" fill="#0b0b0c" font-weight="500" font-style="normal" letter-spacing="0">secondary</text><text x="612" y="84" font-size="6.2" text-anchor="middle" fill="#5c5c61" font-weight="400" font-style="normal" letter-spacing="0">failover</text><rect x="456" y="128" width="214" height="62" rx="0" fill="none" stroke="#d6d6d9" stroke-width="0.6" stroke-dasharray="4 3"/><text x="462" y="122" font-size="6.4" text-anchor="start" fill="#5c5c61" font-weight="500" font-style="normal" letter-spacing="1.2">DOMAIN C · OBJECT STORAGE</text><rect x="466" y="140" width="194" height="38" rx="2" fill="none" stroke="#0b0b0c" stroke-width="0.8"/><text x="563" y="157" font-size="6.6" text-anchor="middle" fill="#0b0b0c" font-weight="500" font-style="normal" letter-spacing="0">versioned bucket · immutable</text><text x="563" y="169" font-size="6.2" text-anchor="middle" fill="#5c5c61" font-weight="400" font-style="normal" letter-spacing="0">separate account</text><line x1="430" y1="100" x2="456" y2="88" stroke="#0b0b0c" stroke-width="0.8" marker-end="url(#ar)"/><line x1="430" y1="130" x2="456" y2="150" stroke="#0b0b0c" stroke-width="0.8" stroke-dasharray="3 2" marker-end="url(#ar)"/><text x="30" y="214" font-size="6.8" text-anchor="start" fill="#111113" font-weight="400" font-style="normal" letter-spacing="0">Loss of domain A stops the front ends but loses nothing: all state is in B and C.</text><text x="30" y="230" font-size="6.8" text-anchor="start" fill="#111113" font-weight="400" font-style="normal" letter-spacing="0">Loss of B stops trading; C is unaffected and still holds backup history.</text><text x="30" y="246" font-size="6.8" text-anchor="start" fill="#111113" font-weight="400" font-style="normal" letter-spacing="0">Loss of C does not stop trading but removes the ability to restore B — the most dangerous single failure.</text><text x="30" y="268" font-size="6.6" text-anchor="start" fill="#c1121f" font-weight="400" font-style="normal" letter-spacing="0">Domains A and B may share a host only if C is outside it. Otherwise a single incident removes both the data and its backup.</text></svg>