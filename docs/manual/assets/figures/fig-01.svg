      <!-- legend -->
      <line x1="14" y1="336" x2="686" y2="336" stroke="#ececee"/>
      <rect x="14" y="350" width="10" height="10" fill="#0b0b0c"/>
      <text x="30" y="359" font-size="7" fill="#6b6b72">stateless service</text>
      <rect x="150" y="350" width="10" height="10" fill="#ffffff" stroke="#c1121f" stroke-width="1.8"/>
      <text x="166" y="359" font-size="7" fill="#6b6b72">operational core</text>
      <rect x="290" y="350" width="10" height="10" fill="#f6f6f7" stroke="#cfcfd4"/>
      <text x="306" y="359" font-size="7" fill="#6b6b72">data store</text>
      <text x="14" y="382" font-size="7.2" fill="#6b6b72">Every arrow is an authenticated call. Services hold no session state; the token is the only carrier of identity and tenancy.</text>
      <text x="14" y="396" font-size="7.2" fill="#6b6b72">No service reads another service's database. Cross-domain data is fetched over HTTP or referenced by identifier only.</text>
      <text x="14" y="416" font-size="6.8" fill="#8a8a91">Ports shown are development defaults; in production each service is bound behind the reverse proxy and not exposed directly.</text>
    </svg>