<svg viewBox="0 0 700 310" xmlns="http://www.w3.org/2000/svg" font-family="Spectral, Georgia, serif"><defs><marker id="ar" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#0b0b0c"/></marker></defs><text x="6" y="14" font-size="7" text-anchor="start" fill="#5c5c61" font-weight="500" font-style="normal" letter-spacing="1.2">GUARD LAYERS AGAINST DOUBLE BILLING</text><rect x="30" y="34" width="640" height="52" fill="none" stroke="#c1121f" stroke-width="0.9" opacity="0.16"/><text x="44" y="56" font-size="7.6" text-anchor="start" fill="#0b0b0c" font-weight="600" font-style="normal" letter-spacing="0">Data</text><text x="130" y="56" font-size="7" text-anchor="start" fill="#111113" font-weight="400" font-style="normal" letter-spacing="0">a delivery line belongs to one bill only</text><text x="44" y="74" font-size="6" text-anchor="start" fill="#5c5c61" font-weight="400" font-style="normal" letter-spacing="0">layer 1</text><rect x="56" y="92" width="588" height="52" fill="none" stroke="#c1121f" stroke-width="0.9" opacity="0.34"/><text x="70" y="114" font-size="7.6" text-anchor="start" fill="#0b0b0c" font-weight="600" font-style="normal" letter-spacing="0">Transaction</text><text x="156" y="114" font-size="7" text-anchor="start" fill="#111113" font-weight="400" font-style="normal" letter-spacing="0">bill issue and delivery marking commit together</text><text x="70" y="132" font-size="6" text-anchor="start" fill="#5c5c61" font-weight="400" font-style="normal" letter-spacing="0">layer 2</text><rect x="82" y="150" width="536" height="52" fill="none" stroke="#c1121f" stroke-width="0.9" opacity="0.56"/><text x="96" y="172" font-size="7.6" text-anchor="start" fill="#0b0b0c" font-weight="600" font-style="normal" letter-spacing="0">Request</text><text x="182" y="172" font-size="7" text-anchor="start" fill="#111113" font-weight="400" font-style="normal" letter-spacing="0">idempotency key returns the first result on retry</text><text x="96" y="190" font-size="6" text-anchor="start" fill="#5c5c61" font-weight="400" font-style="normal" letter-spacing="0">layer 3</text><rect x="108" y="208" width="484" height="52" fill="none" stroke="#c1121f" stroke-width="0.9" opacity="0.8"/><text x="122" y="230" font-size="7.6" text-anchor="start" fill="#0b0b0c" font-weight="600" font-style="normal" letter-spacing="0">Process</text><text x="208" y="230" font-size="7" text-anchor="start" fill="#111113" font-weight="400" font-style="normal" letter-spacing="0">day-close review of unbilled and duplicate totals</text><text x="122" y="248" font-size="6" text-anchor="start" fill="#5c5c61" font-weight="400" font-style="normal" letter-spacing="0">layer 4</text><text x="30" y="278" font-size="6.8" text-anchor="start" fill="#5c5c61" font-weight="400" font-style="normal" letter-spacing="0">A duplicate charge must defeat all four layers. Any single mistake — human or technical — is absorbed by the next layer.</text><text x="30" y="294" font-size="6.8" text-anchor="start" fill="#5c5c61" font-weight="400" font-style="normal" letter-spacing="0">The layers are also tests: the bill_service suite asserts each one, so a control cannot be removed silently.</text></svg>