<svg viewBox="0 0 700 188" xmlns="http://www.w3.org/2000/svg" font-family="Spectral, Georgia, serif"><defs><marker id="ar" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#0b0b0c"/></marker></defs><text x="6" y="14" font-size="7" text-anchor="start" fill="#5c5c61" font-weight="500" font-style="normal" letter-spacing="1.2">ALERT AND ESCALATION FLOW</text><rect x="18" y="40" width="96" height="52" rx="2" fill="none" stroke="#0b0b0c" stroke-width="0.8"/><text x="66" y="60" font-size="7.2" text-anchor="middle" fill="#0b0b0c" font-weight="600" font-style="normal" letter-spacing="0">Signal</text><text x="66" y="74" font-size="6.2" text-anchor="middle" fill="#5c5c61" font-weight="400" font-style="normal" letter-spacing="0">probe</text><line x1="114" y1="66" x2="124" y2="66" stroke="#0b0b0c" stroke-width="0.8" marker-end="url(#ar)"/><rect x="128" y="40" width="96" height="52" rx="2" fill="none" stroke="#0b0b0c" stroke-width="0.8"/><text x="176" y="60" font-size="7.2" text-anchor="middle" fill="#0b0b0c" font-weight="600" font-style="normal" letter-spacing="0">Alert</text><text x="176" y="74" font-size="6.2" text-anchor="middle" fill="#5c5c61" font-weight="400" font-style="normal" letter-spacing="0">threshold or absence</text><line x1="224" y1="66" x2="234" y2="66" stroke="#0b0b0c" stroke-width="0.8" marker-end="url(#ar)"/><rect x="238" y="40" width="96" height="52" rx="2" fill="none" stroke="#0b0b0c" stroke-width="0.8"/><text x="286" y="60" font-size="7.2" text-anchor="middle" fill="#0b0b0c" font-weight="600" font-style="normal" letter-spacing="0">Acknowledge</text><text x="286" y="74" font-size="6.2" text-anchor="middle" fill="#5c5c61" font-weight="400" font-style="normal" letter-spacing="0">on-call</text><line x1="334" y1="66" x2="344" y2="66" stroke="#0b0b0c" stroke-width="0.8" marker-end="url(#ar)"/><rect x="348" y="40" width="96" height="52" rx="2" fill="none" stroke="#0b0b0c" stroke-width="0.8"/><text x="396" y="60" font-size="7.2" text-anchor="middle" fill="#0b0b0c" font-weight="600" font-style="normal" letter-spacing="0">Triage</text><text x="396" y="74" font-size="6.2" text-anchor="middle" fill="#5c5c61" font-weight="400" font-style="normal" letter-spacing="0">severity from the matrix</text><line x1="444" y1="66" x2="454" y2="66" stroke="#0b0b0c" stroke-width="0.8" marker-end="url(#ar)"/><rect x="458" y="40" width="96" height="52" rx="2" fill="none" stroke="#c1121f" stroke-width="0.8"/><text x="506" y="60" font-size="7.2" text-anchor="middle" fill="#0b0b0c" font-weight="600" font-style="normal" letter-spacing="0">Mitigate</text><text x="506" y="74" font-size="6.2" text-anchor="middle" fill="#5c5c61" font-weight="400" font-style="normal" letter-spacing="0">runbook step or rollback</text><line x1="554" y1="66" x2="564" y2="66" stroke="#0b0b0c" stroke-width="0.8" marker-end="url(#ar)"/><rect x="568" y="40" width="96" height="52" rx="2" fill="none" stroke="#c1121f" stroke-width="0.8"/><text x="616" y="60" font-size="7.2" text-anchor="middle" fill="#0b0b0c" font-weight="600" font-style="normal" letter-spacing="0">Review</text><text x="616" y="74" font-size="6.2" text-anchor="middle" fill="#5c5c61" font-weight="400" font-style="normal" letter-spacing="0">actions with owners</text><path d="M 566 92 L 566 116 L 66 116 L 66 96" fill="none" stroke="#c1121f" stroke-width="0.7" stroke-dasharray="3 2" marker-end="url(#ar)"/><text x="316" y="130" font-size="6.4" text-anchor="middle" fill="#c1121f" font-weight="400" font-style="normal" letter-spacing="0">no acknowledgement within target: severity is raised, not the window</text><text x="18" y="158" font-size="6.8" text-anchor="start" fill="#111113" font-weight="400" font-style="normal" letter-spacing="0">Every alert names the likely cause and the first check, so the person woken at night does not begin with an investigation.</text><text x="18" y="174" font-size="6.8" text-anchor="start" fill="#111113" font-weight="400" font-style="normal" letter-spacing="0">An alert that fires routinely without action is a defect: fix the threshold or the cause.</text></svg>