        <text x="362" y="155" font-size="8.6" font-weight="700" fill="#ffffff">service</text>
        <text x="362" y="169" font-size="6.8" fill="#dcdce0">quotations · AI chat</text>

        <rect x="466" y="128" width="106" height="66" rx="3" fill="#0b0b0c"/>
