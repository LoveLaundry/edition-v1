        <text x="588" y="145" font-size="9" font-weight="700" fill="#ffffff">love-ai</text>
        <text x="588" y="158" font-size="6.8" fill="#dcdce0">AI assistant</text>
        <text x="588" y="169" font-size="6.8" fill="#dcdce0">drafting · chat</text>
      </g>

      <!-- bus 2 -->
      <line x1="14" y1="212" x2="686" y2="212" stroke="#cfcfd4" stroke-width="1" stroke-dasharray="3 2"/>
      <line x1="67" y1="194" x2="67" y2="212" stroke="#9fb0c2" stroke-width="1"/>
      <line x1="180" y1="194" x2="180" y2="212" stroke="#9fb0c2" stroke-width="1"/>
      <line x1="293" y1="194" x2="293" y2="212" stroke="#9fb0c2" stroke-width="1"/>
      <line x1="406" y1="194" x2="406" y2="212" stroke="#9fb0c2" stroke-width="1"/>
      <line x1="519" y1="194" x2="519" y2="212" stroke="#9fb0c2" stroke-width="1"/>
      <line x1="632" y1="194" x2="632" y2="212" stroke="#9fb0c2" stroke-width="1"/>
      <text x="350" y="208" font-size="7" fill="#6b6b72" text-anchor="middle" font-style="italic">Motor / PyMongo · per-service credential · TLS</text>

      <text x="14" y="234" font-size="7.5" fill="#8a8a91" letter-spacing="1.6" font-weight="600">DATA STORES · MONGODB</text>

      <!-- databases -->
      <g>
        <rect x="14" y="242" width="210" height="76" rx="3" fill="#f6f6f7" stroke="#cfcfd4"/>
        <text x="26" y="260" font-size="9" font-weight="700" fill="#0b0b0c">user_db</text>
        <text x="26" y="275" font-size="7" fill="#6b6b72">users · laundries</text>
        <text x="26" y="287" font-size="7" fill="#6b6b72">memberships</text>
        <text x="26" y="299" font-size="7" fill="#6b6b72">client_accounts</text>
        <text x="26" y="311" font-size="6.6" font-style="italic" fill="#8a8a91">owner: user-service</text>

        <rect x="236" y="242" width="228" height="76" rx="3" fill="#f8f4ee" stroke="#c1121f"/>
