      <text x="112" y="156" font-size="5.8" fill="#2a2a2e">1 · Status pill — colour indicates stage, text is authoritative (do not rely on colour alone).</text>
      <text x="112" y="168" font-size="5.8" fill="#2a2a2e">2 · Row opens the pass; edit and delivery actions live inside the detail view.</text>
      <text x="112" y="180" font-size="5.8" fill="#2a2a2e">3 · Value is the pass's priced total at current rates; it is not yet a bill.</text>
      <text x="112" y="198" font-size="5.6" fill="#8a8a91">Filters persist for the session, so returning to the register restores the last view. Clear the month filter to see older passes.</text>
