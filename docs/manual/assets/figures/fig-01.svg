        <text x="488" y="275" font-size="7" fill="#6b6b72">customers · transactions</text>
        <text x="488" y="287" font-size="7" fill="#6b6b72">payments · expenses</text>
        <text x="488" y="299" font-size="7" fill="#6b6b72">employees · items · salary</text>
        <text x="488" y="311" font-size="6.6" font-style="italic" fill="#8a8a91">owner: laundry-management</text>
