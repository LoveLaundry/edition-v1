)"/><text x="520.0" y="98" font-size="6.6" text-anchor="middle" fill="#111113" font-weight="400" font-style="normal" letter-spacing="0">count unbilled deliveries</text><line x1="610" y1="122" x2="430" y2="122" stroke="#5c5c61" stroke-width="0.8" stroke-dasharray="3 2" marker-end="url(#ar)"/><text x="520.0" y="116" font-size="6.6" text-anchor="middle" fill="#111113" font-weight="400" font-style="normal" letter-spacing="0">count = 0</text><line x1="430" y1="148" x2="610" y2="148" stroke="#0b0b0c" stroke-width="0.8" marker-end="url(#ar)"/><text x="520.0" y="142" font-size="6.6" text-anchor="middle" fill="#111113" font-weight="400" font-style="normal" letter-spacing="0">write close record + totals</text><line x1="610" y1="166" x2="430" y2="166" stroke="#5c5c61" stroke-width="0.8" stroke-dasharray="3 2" marker-end="url(#ar)"/><text x="520.0" y="160" font-size="6.6" text-anchor="middle" fill="#111113" font-weight="400" font-style="normal" letter-spacing="0">committed</text><line x1="430" y1="192" x2="250" y2="192" stroke="#0b0b0c" stroke-width="0.8" marker-end="url(#ar)"/><text x="340.0" y="186" font-size="6.6" text-anchor="middle" fill="#111113" font-weight="400" font-style="normal" letter-spacing="0">201 close summary</text><line x1="250" y1="214" x2="90" y2="214" stroke="#0b0b0c" stroke-width="0.8" marker-end="url(#ar)"/><text x="170.0" y="208" font-size="6.6" text-anchor="middle" fill="#111113" font-weight="400" font-style="normal" letter-spacing="0">render summary</text><rect x="340" y="236" width="270" height="44" rx="2" fill="none" stroke="#c1121f" stroke-width="0.8" stroke-dasharray="3 2"/><text x="352" y="252" font-size="6.6" text-anchor="start" fill="#c1121f" font-weight="500" font-style="normal" letter-spacing="0">If unbilled > 0: 409 with the list</text><text x="352" y="266" font-size="6.4" text-anchor="start" fill="#5c5c61" font-weight="400" font-style="normal" letter-spacing="0">Nothing is frozen; the operator clears the list and retries.</text><text x="20" y="312" font-size="6.6" text-anchor="start" fill="#5c5c61" font-weight="400" font-style="normal" letter-spacing="0">The freeze and the record commit together: a close either happened or did not, and the operator who closed it is recorded.</text></svg>