<svg viewBox="0 0 700 266" xmlns="http://www.w3.org/2000/svg" font-family="Spectral, Georgia, serif"><defs><marker id="ar" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#0b0b0c"/></marker></defs><text x="6" y="14" font-size="7" text-anchor="start" fill="#5c5c61" font-weight="500" font-style="normal" letter-spacing="1.2">HOTEL PORTAL REQUEST PATH</text><rect x="24" y="60" width="132" height="46" rx="2" fill="none" stroke="#0b0b0c" stroke-width="0.8"/><text x="90" y="80" font-size="7.2" text-anchor="middle" fill="#0b0b0c" font-weight="600" font-style="normal" letter-spacing="0">Client token</text><text x="90" y="93" font-size="6.2" text-anchor="middle" fill="#5c5c61" font-weight="400" font-style="normal" letter-spacing="0">client_scope only</text><rect x="176" y="60" width="132" height="46" rx="2" fill="none" stroke="#0b0b0c" stroke-width="0.8"/><text x="242" y="80" font-size="7.2" text-anchor="middle" fill="#0b0b0c" font-weight="600" font-style="normal" letter-spacing="0">/client-portal</text><text x="242" y="93" font-size="6.2" text-anchor="middle" fill="#5c5c61" font-weight="400" font-style="normal" letter-spacing="0">staff routes refuse it</text><rect x="328" y="60" width="132" height="46" rx="2" fill="none" stroke="#0b0b0c" stroke-width="0.8"/><text x="394" y="80" font-size="7.2" text-anchor="middle" fill="#0b0b0c" font-weight="600" font-style="normal" letter-spacing="0">scope extraction</text><text x="394" y="93" font-size="6.2" text-anchor="middle" fill="#5c5c61" font-weight="400" font-style="normal" letter-spacing="0">laundry_id + client_name</text><rect x="480" y="60" width="132" height="46" rx="2" fill="none" stroke="#0b0b0c" stroke-width="0.8"/><text x="546" y="80" font-size="7.2" text-anchor="middle" fill="#0b0b0c" font-weight="600" font-style="normal" letter-spacing="0">dual filter</text><text x="546" y="93" font-size="6.2" text-anchor="middle" fill="#5c5c61" font-weight="400" font-style="normal" letter-spacing="0">both keys required</text><line x1="156" y1="83" x2="168" y2="83" stroke="#0b0b0c" stroke-width="0.8" marker-end="url(#ar)"/><line x1="308" y1="83" x2="320" y2="83" stroke="#0b0b0c" stroke-width="0.8" marker-end="url(#ar)"/><line x1="460" y1="83" x2="472" y2="83" stroke="#0b0b0c" stroke-width="0.8" marker-end="url(#ar)"/><rect x="480" y="132" width="196" height="54" rx="2" fill="#f4f4f5" stroke="#c1121f" stroke-width="0.8"/><text x="578" y="150" font-size="6.8" text-anchor="middle" fill="#0b0b0c" font-weight="500" font-style="normal" letter-spacing="0">gate passes · deliveries · bills</text><text x="578" y="164" font-size="6.4" text-anchor="middle" fill="#5c5c61" font-weight="400" font-style="normal" letter-spacing="0">for one property only</text><line x1="546" y1="106" x2="546" y2="132" stroke="#c1121f" stroke-width="0.8" marker-end="url(#ar)"/><rect x="24" y="132" width="420" height="54" rx="2" fill="none" stroke="#d6d6d9" stroke-width="0.6" stroke-dasharray="3 2"/><text x="36" y="149" font-size="6.8" text-anchor="start" fill="#c1121f" font-weight="600" font-style="normal" letter-spacing="0">Rejected paths</text><text x="36" y="163" font-size="6.4" text-anchor="start" fill="#5c5c61" font-weight="400" font-style="normal" letter-spacing="0">staff token to /client-portal — no client_scope</text><text x="36" y="175" font-size="6.4" text-anchor="start" fill="#5c5c61" font-weight="400" font-style="normal" letter-spacing="0">client token to /gate-passes — no laundry_id, tenant dependency fails closed</text><text x="24" y="214" font-size="6.8" text-anchor="start" fill="#111113" font-weight="400" font-style="normal" letter-spacing="0">Every query is built as { laundry_id, client_name, … }. A request naming another property cannot match.</text><text x="24" y="230" font-size="6.8" text-anchor="start" fill="#111113" font-weight="400" font-style="normal" letter-spacing="0">A request for an invoice belonging to another property returns 404 — identical to an invoice that does not exist.</text><text x="24" y="252" font-size="6.6" text-anchor="start" fill="#c1121f" font-weight="400" font-style="normal" letter-spacing="0">12-hour lifetime; no capability list; no membership; no tenant claim.</text></svg>