<svg viewBox="0 0 700 132" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="700" height="132" fill="#fbfcfd"/><defs><marker id="af" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#c1121f"/></marker></defs><text x="6" y="14" font-size="7" fill="#8a8a91" letter-spacing="1.4" font-weight="600">INCIDENT ROLES</text><rect x="6.0" y="26" width="108.8" height="80" rx="3" fill="#ffffff" stroke="#cfcfd4"/><text x="60.4" y="41" font-size="7.6" font-weight="700" fill="#0b0b0c" text-anchor="middle">Reporter</text><text x="60.4" y="54" font-size="6.4" fill="#6b6b72" text-anchor="middle">staff or</text><text x="60.4" y="64" font-size="6.4" fill="#6b6b72" text-anchor="middle">monitoring</text><line x1="115.3" y1="66" x2="120.8" y2="66" stroke="#c1121f" stroke-width="1.2" marker-end="url(#af)"/><rect x="121.8" y="26" width="108.8" height="80" rx="3" fill="#0b0b0c" stroke="#0b0b0c"/><text x="176.2" y="41" font-size="7.6" font-weight="700" fill="#ffffff" text-anchor="middle">On-call</text><text x="176.2" y="54" font-size="6.4" fill="#dcdce0" text-anchor="middle">declares</text><text x="176.2" y="64" font-size="6.4" fill="#dcdce0" text-anchor="middle">severity</text><line x1="231.2" y1="66" x2="236.7" y2="66" stroke="#c1121f" stroke-width="1.2" marker-end="url(#af)"/><rect x="237.7" y="26" width="108.8" height="80" rx="3" fill="#ffffff" stroke="#cfcfd4"/><text x="292.1" y="41" font-size="7.6" font-weight="700" fill="#0b0b0c" text-anchor="middle">Incident lead</text><text x="292.1" y="54" font-size="6.4" fill="#6b6b72" text-anchor="middle">contains</text><text x="292.1" y="64" font-size="6.4" fill="#6b6b72" text-anchor="middle">coordinates</text><line x1="347.0" y1="66" x2="352.5" y2="66" stroke="#c1121f" stroke-width="1.2" marker-end="url(#af)"/><rect x="353.5" y="26" width="108.8" height="80" rx="3" fill="#ffffff" stroke="#cfcfd4"/><text x="407.9" y="41" font-size="7.6" font-weight="700" fill="#0b0b0c" text-anchor="middle">Scribe</text><text x="407.9" y="54" font-size="6.4" fill="#6b6b72" text-anchor="middle">timeline</text><text x="407.9" y="64" font-size="6.4" fill="#6b6b72" text-anchor="middle">decisions</text><line x1="462.8" y1="66" x2="468.3" y2="66" stroke="#c1121f" stroke-width="1.2" marker-end="url(#af)"/><rect x="469.3" y="26" width="108.8" height="80" rx="3" fill="#ffffff" stroke="#cfcfd4"/><text x="523.8" y="41" font-size="7.6" font-weight="700" fill="#0b0b0c" text-anchor="middle">Recovery</text><text x="523.8" y="54" font-size="6.4" fill="#6b6b72" text-anchor="middle">restore or</text><text x="523.8" y="64" font-size="6.4" fill="#6b6b72" text-anchor="middle">failover</text><line x1="578.7" y1="66" x2="584.2" y2="66" stroke="#c1121f" stroke-width="1.2" marker-end="url(#af)"/><rect x="585.2" y="26" width="108.8" height="80" rx="3" fill="#ffffff" stroke="#cfcfd4"/><text x="639.6" y="41" font-size="7.6" font-weight="700" fill="#0b0b0c" text-anchor="middle">Verification</text><text x="639.6" y="54" font-size="6.4" fill="#6b6b72" text-anchor="middle">real user</text><text x="639.6" y="64" font-size="6.4" fill="#6b6b72" text-anchor="middle">checks</text><text x="6" y="124" font-size="6.4" fill="#8a8a91">Each stage is a server-side check; the request stops at the first failure.</text></svg>