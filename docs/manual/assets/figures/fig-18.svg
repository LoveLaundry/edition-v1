"/><text x="210.4" y="109" font-size="7.4" font-weight="600" fill="#ffffff" text-anchor="middle">deliver</text><text x="8" y="174" font-size="6.6" fill="#8a8a91">Forward transitions only, each written by a scan event. Exceptions (mark_missing, mark_damaged) branch off the active state and must be resolved by a supervisor.</text></svg>