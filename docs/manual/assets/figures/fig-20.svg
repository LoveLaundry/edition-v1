<svg viewBox="0 0 700 268" xmlns="http://www.w3.org/2000/svg" font-family="Spectral, Georgia, serif"><defs><marker id="ar" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#0b0b0c"/></marker></defs><text x="6" y="14" font-size="7" text-anchor="start" fill="#5c5c61" font-weight="500" font-style="normal" letter-spacing="1.2">LINEN LIFECYCLE STATE MACHINE</text><rect x="20" y="46" width="78" height="30" rx="2" fill="none" stroke="#0b0b0c" stroke-width="0.8"/><text x="59.0" y="65" font-size="6.8" text-anchor="middle" fill="#0b0b0c" font-weight="500" font-style="normal" letter-spacing="0">collect</text><line x1="98" y1="61" x2="112" y2="61" stroke="#0b0b0c" stroke-width="0.8" marker-end="url(#ar)"/><rect x="114" y="46" width="78" height="30" rx="2" fill="none" stroke="#0b0b0c" stroke-width="0.8"/><text x="153.0" y="65" font-size="6.8" text-anchor="middle" fill="#0b0b0c" font-weight="500" font-style="normal" letter-spacing="0">receive</text><line x1="192" y1="61" x2="206" y2="61" stroke="#0b0b0c" stroke-width="0.8" marker-end="url(#ar)"/><rect x="208" y="46" width="78" height="30" rx="2" fill="none" stroke="#0b0b0c" stroke-width="0.8"/><text x="247.0" y="65" font-size="6.8" text-anchor="middle" fill="#0b0b0c" font-weight="500" font-style="normal" letter-spacing="0">start_wash</text><line x1="286" y1="61" x2="300" y2="61" stroke="#0b0b0c" stroke-width="0.8" marker-end="url(#ar)"/><rect x="302" y="46" width="78" height="30" rx="2" fill="none" stroke="#0b0b0c" stroke-width="0.8"/><text x="341.0" y="65" font-size="6.8" text-anchor="middle" fill="#0b0b0c" font-weight="500" font-style="normal" letter-spacing="0">complete_wash</text><line x1="380" y1="61" x2="394" y2="61" stroke="#0b0b0c" stroke-width="0.8" marker-end="url(#ar)"/><rect x="396" y="46" width="78" height="30" rx="2" fill="none" stroke="#0b0b0c" stroke-width="0.8"/><text x="435.0" y="65" font-size="6.8" text-anchor="middle" fill="#0b0b0c" font-weight="500" font-style="normal" letter-spacing="0">press</text><line x1="474" y1="61" x2="488" y2="61" stroke="#0b0b0c" stroke-width="0.8" marker-end="url(#ar)"/><rect x="490" y="46" width="78" height="30" rx="2" fill="none" stroke="#0b0b0c" stroke-width="0.8"/><text x="529.0" y="65" font-size="6.8" text-anchor="middle" fill="#0b0b0c" font-weight="500" font-style="normal" letter-spacing="0">ready</text><line x1="568" y1="61" x2="582" y2="61" stroke="#0b0b0c" stroke-width="0.8" marker-end="url(#ar)"/><rect x="584" y="46" width="78" height="30" rx="2" fill="none" stroke="#c1121f" stroke-width="0.8"/><text x="623.0" y="65" font-size="6.8" text-anchor="middle" fill="#0b0b0c" font-weight="500" font-style="normal" letter-spacing="0">deliver</text><text x="20" y="38" font-size="6.4" text-anchor="start" fill="#5c5c61" font-weight="500" font-style="normal" letter-spacing="1.2">FORWARD PATH · ONE SCAN EVENT PER TRANSITION</text><rect x="250" y="108" width="200" height="34" rx="2" fill="none" stroke="#c1121f" stroke-width="0.9" stroke-dasharray="4 3"/><text x="350" y="129" font-size="6.8" text-anchor="middle" fill="#c1121f" font-weight="600" font-style="normal" letter-spacing="0">mark_missing / mark_damaged</text><line x1="160" y1="76" x2="300" y2="108" stroke="#c1121f" stroke-width="0.8" stroke-dasharray="3 2" marker-end="url(#ar)"/><line x1="560" y1="76" x2="450" y2="108" stroke="#c1121f" stroke-width="0.8" stroke-dasharray="3 2" marker-end="url(#ar)"/><rect x="490" y="108" width="130" height="34" rx="2" fill="none" stroke="#c1121f" stroke-width="0.8"/><text x="555" y="129" font-size="6.8" text-anchor="middle" fill="#c1121f" font-weight="600" font-style="normal" letter-spacing="0">retire</text><line x1="600" y1="142" x2="600" y2="168" stroke="#c1121f" stroke-width="0.8" stroke-dasharray="3 2" marker-end="url(#ar)"/><text x="20" y="168" font-size="7.2" text-anchor="start" fill="#0b0b0c" font-weight="600" font-style="normal" letter-spacing="0">Exception states</text><text x="20" y="184" font-size="6.8" text-anchor="start" fill="#c1121f" font-weight="600" font-style="normal" letter-spacing="0">missing</text><text x="110" y="184" font-size="6.8" text-anchor="start" fill="#111113" font-weight="400" font-style="normal" letter-spacing="0">item not found after a documented search; supervisor review</text><text x="20" y="200" font-size="6.8" text-anchor="start" fill="#c1121f" font-weight="600" font-style="normal" letter-spacing="0">damaged</text><text x="110" y="200" font-size="6.8" text-anchor="start" fill="#111113" font-weight="400" font-style="normal" letter-spacing="0">torn or unusable; liability assessed against the client contract</text><text x="20" y="216" font-size="6.8" text-anchor="start" fill="#c1121f" font-weight="600" font-style="normal" letter-spacing="0">retired</text><text x="110" y="216" font-size="6.8" text-anchor="start" fill="#111113" font-weight="400" font-style="normal" letter-spacing="0">permanently withdrawn; the tag is never reused</text><text x="20" y="240" font-size="6.6" text-anchor="start" fill="#5c5c61" font-weight="400" font-style="normal" letter-spacing="0">No reverse transition exists. A wrongly scanned item is corrected by recording the event and scanning it forward again.</text><text x="20" y="256" font-size="6.6" text-anchor="start" fill="#5c5c61" font-weight="400" font-style="normal" letter-spacing="0">Every transition carries the acting user and a timestamp; the tag history is the evidence in a client dispute.</text></svg>