      <line x1="213" y1="78" x2="213" y2="94" stroke="#9fb0c2" stroke-width="1"/>
      <line x1="348" y1="78" x2="348" y2="94" stroke="#9fb0c2" stroke-width="1"/>
      <line x1="483" y1="78" x2="483" y2="94" stroke="#9fb0c2" stroke-width="1"/>
      <line x1="620" y1="78" x2="620" y2="94" stroke="#9fb0c2" stroke-width="1"/>
      <text x="350" y="90" font-size="7" fill="#6b6b72" text-anchor="middle" font-style="italic">HTTPS · JSON · Authorization: Bearer &lt;token&gt;</text>

      <text x="14" y="120" font-size="7.5" fill="#8a8a91" letter-spacing="1.6" font-weight="600">SERVICES · PYTHON / FASTAPI</text>

