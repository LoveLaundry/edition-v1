<svg viewBox="0 0 700 226" xmlns="http://www.w3.org/2000/svg" font-family="Spectral, Georgia, serif"><defs><marker id="ar" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#0b0b0c"/></marker></defs><text x="6" y="14" font-size="7" text-anchor="start" fill="#5c5c61" font-weight="500" font-style="normal" letter-spacing="1.2">BACKUP, RETENTION AND RECOVERY TIMELINE</text><line x1="40" y1="150" x2="672" y2="150" stroke="#0b0b0c" stroke-width="0.8"/><line x1="40" y1="146" x2="40" y2="154" stroke="#0b0b0c" stroke-width="0.8"/><text x="40" y="166" font-size="6.4" text-anchor="middle" fill="#5c5c61" font-weight="400" font-style="normal" letter-spacing="0">-35 d</text><line x1="545.6" y1="146" x2="545.6" y2="154" stroke="#0b0b0c" stroke-width="0.8"/><text x="545.6" y="166" font-size="6.4" text-anchor="middle" fill="#5c5c61" font-weight="400" font-style="normal" letter-spacing="0">-7 d</text><line x1="621.44" y1="146" x2="621.44" y2="154" stroke="#0b0b0c" stroke-width="0.8"/><text x="621.44" y="166" font-size="6.4" text-anchor="middle" fill="#5c5c61" font-weight="400" font-style="normal" letter-spacing="0">now</text><line x1="672.0" y1="146" x2="672.0" y2="154" stroke="#0b0b0c" stroke-width="0.8"/><text x="672.0" y="166" font-size="6.4" text-anchor="middle" fill="#5c5c61" font-weight="400" font-style="normal" letter-spacing="0">+24 h</text><text x="6" y="50" font-size="7" text-anchor="start" fill="#0b0b0c" font-weight="500" font-style="normal" letter-spacing="0">Daily logical dump</text><rect x="40.0" y="40" width="581.44" height="14" rx="2" fill="#f4f4f5" stroke="#0b0b0c" stroke-width="0.6"/><text x="46.0" y="50" font-size="6.2" text-anchor="start" fill="#5c5c61" font-weight="400" font-style="normal" letter-spacing="0">35 daily · 12 monthly</text><text x="6" y="86" font-size="7" text-anchor="start" fill="#0b0b0c" font-weight="500" font-style="normal" letter-spacing="0">Oplog (continuous)</text><rect x="431.84" y="76" width="189.6" height="14" rx="2" fill="#f4f4f5" stroke="#0b0b0c" stroke-width="0.6"/><text x="437.84" y="86" font-size="6.2" text-anchor="start" fill="#5c5c61" font-weight="400" font-style="normal" letter-spacing="0">72-hour replay window</text><text x="6" y="122" font-size="7" text-anchor="start" fill="#0b0b0c" font-weight="500" font-style="normal" letter-spacing="0">Off-host copy</text><rect x="40.0" y="112" width="505.6" height="14" rx="2" fill="#f4f4f5" stroke="#0b0b0c" stroke-width="0.6"/><text x="46.0" y="122" font-size="6.2" text-anchor="start" fill="#5c5c61" font-weight="400" font-style="normal" letter-spacing="0">immutable 90 days · separate account</text><line x1="621.44" y1="30" x2="621.44" y2="150" stroke="#c1121f" stroke-width="0.8" stroke-dasharray="3 2" marker-end="url(#ar)"/><text x="615.44" y="26" font-size="6.6" text-anchor="end" fill="#c1121f" font-weight="600" font-style="normal" letter-spacing="0">failure</text><rect x="611.96" y="132" width="26" height="12" rx="2" fill="none" stroke="#c1121f" stroke-width="0.7"/><text x="624.96" y="141" font-size="5.8" text-anchor="middle" fill="#c1121f" font-weight="400" font-style="normal" letter-spacing="0">15 min RPO</text><text x="6" y="196" font-size="6.8" text-anchor="start" fill="#111113" font-weight="400" font-style="normal" letter-spacing="0">The oplog closes the gap between last night's dump and the moment of failure; without it the achievable RPO is 24 hours.</text><text x="6" y="212" font-size="6.8" text-anchor="start" fill="#111113" font-weight="400" font-style="normal" letter-spacing="0">The off-host copy is what makes ransomware survivable. It is written with a credential the application host does not hold.</text></svg>