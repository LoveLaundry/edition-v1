        <text x="136" y="158" font-size="6.8" fill="#dcdce0">operational core</text>
        <text x="136" y="169" font-size="6.8" fill="#dcdce0">passes · bills · linen</text>
        <text x="136" y="183" font-size="7" font-weight="700" fill="#c1121f">:8001</text>

        <rect x="240" y="128" width="106" height="66" rx="3" fill="#0b0b0c"/>
