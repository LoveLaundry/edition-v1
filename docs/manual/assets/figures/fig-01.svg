<svg viewBox="0 0 700 438" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
      <rect x="0" y="0" width="700" height="438" fill="#fbfcfd"/>
      <text x="14" y="16" font-size="7.5" fill="#8a8a91" letter-spacing="1.6" font-weight="600">CLIENT APPLICATIONS</text>

