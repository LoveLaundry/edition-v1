<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="700" height="250" fill="#fbfcfd"/><polygon points="225,12 375,12 430,79 170,79" fill="#0b0b0c" stroke="#ffffff" stroke-width="1.5"/><text x="300" y="48" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">Manual and exploratory checks</text><text x="444" y="51" font-size="6.8" fill="#6b6b72">operator-run, per release</text><polygon points="170,85 430,85 485,153 115,153" fill="#0b0b0c" stroke="#ffffff" stroke-width="1.5"/><text x="300" y="121" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">Build and compile verification</text><text x="499" y="124" font-size="6.8" fill="#6b6b72">four front ends, TypeScript + Vite</text><polygon points="115,159 485,159 540,226 60,226" fill="#c1121f" stroke="#ffffff" stroke-width="1.5"/><text x="300" y="194" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">Service integration tests</text><text x="554" y="197" font-size="6.8" fill="#6b6b72">auth, tenancy, portals, money</text><text x="8" y="244" font-size="6.6" fill="#8a8a91">Width indicates volume of tests, not importance. The narrow top layer is where a defect is most expensive and least frequent.</text></svg>